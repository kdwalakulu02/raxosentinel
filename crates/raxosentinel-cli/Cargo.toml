[package]
name = "raxosentinel-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Command-line malware scanner for RaxoSentinel"

[[bin]]
name = "raxosentinel"
path = "src/main.rs"

[[bin]]
name = "stress_benchmark"
path = "src/bin/stress_benchmark.rs"

[[bin]]
name = "rsidb_benchmark"
path = "src/bin/rsidb_benchmark.rs"

[dependencies]
raxosentinel-core = { path = "../raxosentinel-core" }
raxosentinel-filetypes = { path = "../raxosentinel-filetypes" }
raxosentinel-signatures = { path = "../raxosentinel-signatures" }
raxosentinel-email = { path = "../raxosentinel-email" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2 = { workspace = true }
hex.workspace = true
ed25519-dalek = { workspace = true }

[dev-dependencies]
rand.workspace = true
tempfile.workspace = true
criterion.workspace = true
zip.workspace = true
hex.workspace = true

[[bench]]
name = "scanner_benchmarks"
harness = false
