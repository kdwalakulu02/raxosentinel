[workspace]
members = [
    "crates/raxosentinel-core",
    "crates/raxosentinel-filetypes",
    "crates/raxosentinel-signatures",
    "crates/raxosentinel-email",
    "crates/raxosentinel-cli",
]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["RaxoSentinel Contributors"]
license = "GPL-2.0-or-later"
repository = "https://github.com/raxosentinel/raxosentinel"
homepage = "https://raxosentinel.org"
readme = "README.md"
keywords = ["malware", "antivirus", "scanner", "email-security", "mime"]
categories = ["command-line-utilities", "security"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "cargo"] }
aho-corasick = "1.1"
mail-parser = "1.0"
tempfile = "3.16"
criterion = { version = "0.5", features = ["html_reports"] }
