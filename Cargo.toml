[workspace]
members = [
    "crates/raxosentinel-core",
    "crates/raxosentinel-filetypes",
    "crates/raxosentinel-signatures",
    "crates/raxosentinel-email",
    "crates/raxosentinel-cli",
]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["RaxoSentinel Contributors"]
license = "GPL-2.0-or-later"
repository = "https://github.com/raxosentinel/raxosentinel"
homepage = "https://raxosentinel.org"
readme = "README.md"
keywords = ["malware", "antivirus", "scanner", "email-security", "mime"]
categories = ["command-line-utilities", "security"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
aho-corasick = "1.1"
mail-parser = "1.0"
tempfile = "3.16"
criterion = { version = "0.5", features = ["html_reports"] }
memmap2 = "0.9"
sha1 = "0.10"
md-5 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "rand_core"] }
rand = "0.8"
# YARA-X: pinned exactly; only the modules below are compiled in.
yara-x = { version = "=1.23.0", default-features = false, features = [
    "constant-folding", "exact-atoms", "fast-regexp",
    "hash-module", "math-module", "string-module", "time-module",
    "pe-module", "elf-module", "lnk-module",
] }

# Full debug info for third-party crates (YARA-X, wasmtime, cranelift) dominates rustc
# and linker memory in dev/test builds on small (8 GiB) machines. Dependencies keep line
# tables for backtraces; workspace crates keep full debug info.
[profile.dev.package."*"]
debug = "line-tables-only"

[profile.dev.package.cranelift-codegen]
debug = false
